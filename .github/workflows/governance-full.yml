name: Governance Full

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

jobs:
  policy_full:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.validate_pr.outputs.tier }}
      detected_tier: ${{ steps.validate_pr.outputs.detected_tier }}
      implied_tier: ${{ steps.validate_pr.outputs.implied_tier }}
      final_tier: ${{ steps.validate_pr.outputs.final_tier }}
      required_checks: ${{ steps.validate_pr.outputs.required_checks }}
      workspaces: ${{ steps.impact.outputs.workspaces }}
      run_schema: ${{ steps.impact.outputs.run_schema }}

    steps:
      - name: Checkout PR HEAD (stabilize evidence)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical evidence (CI)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run governance:emit:ci

      - name: Validate full governance contract
        id: validate_pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOVERNANCE_SUMMARY: 'true'
        run: node --trace-uncaught --trace-warnings --experimental-strip-types control-plane/validate-pr.ts --mode full

      - name: Detect impacted workspaces
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types control-plane/impact.ts

      - name: Report full policy resolution
        run: node --experimental-strip-types control-plane/report-policy-resolution.ts
