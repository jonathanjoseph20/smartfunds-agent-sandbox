name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  workflow_integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify workflow YAML and entrypoints
        run: npm run lint:workflows

  detect_governance_profile:
    if: github.event_name == 'pull_request'
    needs: workflow_integrity
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.detect_profile.outputs.profile }}
      requested_profile: ${{ steps.detect_profile.outputs.requested_profile }}
      required_profile: ${{ steps.detect_profile.outputs.required_profile }}
      final_profile: ${{ steps.detect_profile.outputs.final_profile }}
      matched_scopes: ${{ steps.detect_profile.outputs.matched_scopes }}
      routing_source: ${{ steps.detect_profile.outputs.routing_source }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Detect governance profile
        id: detect_profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOVERNANCE_SUMMARY: 'true'
        run: node --trace-uncaught --trace-warnings --experimental-strip-types control-plane/validate-pr.ts --mode route

      - name: Report governance route
        run: |
          echo "Detected profile: ${{ steps.detect_profile.outputs.profile }}"
          echo "Requested profile: ${{ steps.detect_profile.outputs.requested_profile }}"
          echo "Required profile: ${{ steps.detect_profile.outputs.required_profile }}"
          echo "Final profile: ${{ steps.detect_profile.outputs.final_profile }}"
          echo "Matched scope: ${{ steps.detect_profile.outputs.matched_scopes }}"
          echo "Routing governance: ${{ steps.detect_profile.outputs.final_profile }}"

  governance_build:
    if: github.event_name == 'pull_request' && needs.detect_governance_profile.outputs.final_profile == 'build'
    needs: detect_governance_profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Validate build governance route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOVERNANCE_SUMMARY: 'true'
        run: node --trace-uncaught --trace-warnings --experimental-strip-types control-plane/validate-pr.ts --mode full

  governance_core:
    if: github.event_name == 'pull_request' && needs.detect_governance_profile.outputs.final_profile == 'core'
    needs: detect_governance_profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap governance labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run bootstrap:labels -- --yes

      - name: Auto-apply missing tier label from PR body
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run governance:auto-label

      - name: Validate full governance contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOVERNANCE_SUMMARY: 'true'
        run: node --trace-uncaught --trace-warnings --experimental-strip-types control-plane/validate-pr.ts --mode full

  quality_checks:
    if: github.event_name == 'pull_request' && needs.detect_governance_profile.outputs.final_profile != 'lite'
    needs: detect_governance_profile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test

  governance_lite_notice:
    if: github.event_name == 'pull_request' && needs.detect_governance_profile.outputs.final_profile == 'lite'
    needs: detect_governance_profile
    runs-on: ubuntu-latest
    steps:
      - name: Report lite routing
        run: |
          echo "Detected profile: lite"
          echo "Routing governance: lite"
          echo "Governance enforcement skipped for lite profile."
