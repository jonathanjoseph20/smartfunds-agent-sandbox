name: Governance Full

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

jobs:
  workflow_integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR HEAD (workflow integrity)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify workflow YAML and entrypoints
        run: npm run lint:workflows

  policy_full:
    if: github.event_name == 'pull_request'
    needs: workflow_integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR HEAD (stabilize evidence)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical evidence (CI)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run governance:emit:ci

      - name: Assert evidence idempotent
        run: |
          git diff --exit-code -- governance/evidence.json || (echo "Evidence drift detected." && echo "Run:" && echo "  npm run governance:emit" && echo "  git add governance/evidence.json" && echo "  git commit -m \"fix(governance): canonicalize evidence\"" && exit 1)

      - name: Validate PR body contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run pr:body:check

      - name: Validate full governance contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOVERNANCE_SUMMARY: 'true'
        run: node --trace-uncaught --trace-warnings --experimental-strip-types control-plane/validate-pr.ts --mode full
